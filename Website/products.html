        <img src="assets/Image/Logo Main.png" alt="Soon Bakery — Cakes and Cookies est. 2005">
      </div>

  <!-- Category filter -->
  <nav class="category-nav" aria-label="Product categories">

      <button type="button" class="category-link" data-category="cookies">Cookies</button>
      <span class="category-divider" aria-hidden="true">|</span>

    </div>
    <div class="category-row">
      <button type="button" class="category-link" data-category="cny-goodies">CNY Goodies</button>
      <span class="category-divider" aria-hidden="true">|</span>
      <button type="button" class="category-link" data-category="mid-autumn">Mid Autumn Delights</button>
      <span class="category-divider" aria-hidden="true">|</span>
      <button type="button" class="category-link" data-category="xmas-treats">Xmas Treats</button>
    </div>
  </nav>

  <!-- Product grid -->
  <main class="products-main">
    <div class="shop-product-grid" id="shop-product-grid"></div>
